databaseChangeLog:
  - changeSet:
      id: create-participant-table
      author: rmaksym1
      changes:
        - createTable:
            tableName: participants
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    unique: true
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: rental_pack_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_packs_participants
                    references: packs(id)
              - column:
                  name: booking_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_participants
                    references: bookings(id)
              - column:
                  name: instructor_hours
                  type: int
                  constraints:
                    nullable: false